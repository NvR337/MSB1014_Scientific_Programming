<svg width="100%" viewBox="0 0 680 530" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Network figure legend</title>
<desc>Legend for the LAR and ISS-T STRING networks: function colours, direction of change by node shape, shared-gene ring, node size by degree, and edge width by STRING score.</desc>
<rect x="170" y="10" width="340" height="505" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.75"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="190" y="40" font-size="14" font-weight="bold" fill="#111111">Function</text>
<rect x="190" y="56" width="16" height="16" rx="3" fill="#E69F00"/>
<text x="216" y="69" font-size="14" fill="#222222">Cholesterol metabolism</text>
<rect x="190" y="80" width="16" height="16" rx="3" fill="#D55E00"/>
<text x="216" y="93" font-size="14" fill="#222222">Fatty acid metabolism</text>
<rect x="190" y="104" width="16" height="16" rx="3" fill="#009E73"/>
<text x="216" y="117" font-size="14" fill="#222222">Glutathione / xenobiotic metabolism</text>
<rect x="190" y="128" width="16" height="16" rx="3" fill="#0072B2"/>
<text x="216" y="141" font-size="14" fill="#222222">Cytosolic ribosomal proteins</text>
<rect x="190" y="152" width="16" height="16" rx="3" fill="#CC79A7"/>
<text x="216" y="165" font-size="14" fill="#222222">Circadian rhythm</text>
<rect x="190" y="176" width="16" height="16" rx="3" fill="#D9D9D9"/>
<text x="216" y="189" font-size="14" fill="#222222">Other / not enriched</text>

<text x="190" y="226" font-size="14" font-weight="bold" fill="#111111">Direction (flight vs ground)</text>
<polygon points="198,240 207,250 198,260 189,250" fill="#D9D9D9" stroke="#888888" stroke-width="0.75"/>
<text x="216" y="255" font-size="14" fill="#222222">Up in flight</text>
<polygon points="198,266 208,283 188,283" fill="#D9D9D9" stroke="#888888" stroke-width="0.75"/>
<text x="216" y="281" font-size="14" fill="#222222">Down in flight</text>

<text x="190" y="318" font-size="14" font-weight="bold" fill="#111111">Overlap</text>
<polygon points="198,331 207,341 198,351 189,341" fill="#D9D9D9" stroke="#000000" stroke-width="2.5"/>
<text x="216" y="346" font-size="14" fill="#222222">DEG in both LAR and ISS-T</text>

<text x="190" y="384" font-size="14" font-weight="bold" fill="#111111">Node size = degree</text>
<polygon points="203,407 208,412 203,417 198,412" fill="#D9D9D9"/>
<polygon points="240,402.5 249.5,412 240,421.5 230.5,412" fill="#D9D9D9"/>
<polygon points="292,397 307,412 292,427 277,412" fill="#D9D9D9"/>
<text x="203" y="446" font-size="12" fill="#444444" text-anchor="middle">1</text>
<text x="240" y="446" font-size="12" fill="#444444" text-anchor="middle">25</text>
<text x="292" y="446" font-size="12" fill="#444444" text-anchor="middle">55</text>

<text x="190" y="478" font-size="14" font-weight="bold" fill="#111111">Edge width = STRING score</text>
<line x1="192" y1="498" x2="240" y2="498" stroke="#BBBBBB" stroke-width="0.75" stroke-linecap="round"/>
<text x="248" y="502" font-size="12" fill="#444444">0.4</text>
<line x1="290" y1="498" x2="338" y2="498" stroke="#BBBBBB" stroke-width="3" stroke-linecap="round"/>
<text x="346" y="502" font-size="12" fill="#444444">1.0</text>
</g>
</svg>
